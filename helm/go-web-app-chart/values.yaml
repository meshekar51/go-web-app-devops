# Default values for go-web-app-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: abhishekf5/go-web-app
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "36618721015"

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

gateway:
  enabled: true

  gatewayClass:
    # Set false if aws-alb GatewayClass already exists.
    create: true
    name: aws-alb
    controllerName: gateway.k8s.aws/alb

  name: go-web-alb

  alb:
    scheme: internet-facing

  listener:
    name: http
    port: 80

  route:
    # Empty means you can browse directly using the ALB DNS name.
    hostnames: []
    path: /
    pathType: PathPrefix

  backend:
    # Must match the Service created by your chart.
    serviceName: go-web-app
    servicePort: 80
    targetType: ip

